<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" href="logo.png" type="image/png">
  <meta charset="UTF-8">
  <title>AM4R</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- important for mobile scaling -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body, html { height: 100%; width: 100%; font-family: Arial, sans-serif; color: #fff; }

    /* Landing page */
    .center-content {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(45deg, #111, #333);
    }

    .enter-button {
      font-size: 90px;
      color: #fff;
      text-decoration: none;
      background: #6a6a6a;
      padding: 25px 50px;
      border-radius: 50px;
      border: 2px solid #fff;
      transition: all 0.3s ease;
      font-weight: bold;
    }
    .enter-button:hover { background: #000; transform: scale(1.1); }

    /* Background video */
    video#bgVideo {
      position: fixed; top: 0; left: 0;
      min-width: 100%; min-height: 100%;
      object-fit: cover;
      z-index: -1;
    }

    /* Title text */
    .title {
      text-align: center;
      padding-top: 50px;
    }
    .title h1 {
      font-size: 100px;
      text-shadow: 0 0 15px #fff, 0 0 25px #0ff, 0 0 50px #0ff;
      animation: glow 2s ease-in-out infinite alternate;
    }
    .title p {
      font-size: 40px;
      margin-top: 10px;
      text-shadow: 0 0 10px #fff, 0 0 20px #f0f;
    }
    @keyframes glow {
      from { text-shadow: 0 0 10px #fff, 0 0 20px #0ff, 0 0 40px #0ff; }
      to   { text-shadow: 0 0 20px #fff, 0 0 40px #0ff, 0 0 80px #0ff; }
    }

    /* Center gif */
    .center-gif {
      position: absolute; top: 45%; left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
    }
    .center-gif img {
      width: 220px; height: 220px;
      object-fit: cover;
      border-radius: 50%;
      border: 4px solid #fff;
      box-shadow: 0 0 20px #0ff;
    }

    /* UID badge */
    .uid-badge {
      position: absolute;
      top: 65%;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.6);
      color: #fff;
      padding: 12px 20px;
      border-radius: 12px;
      font-size: 20px;
      font-weight: bold;
      display: inline-block;
      box-shadow: 0 0 10px #0ff, 0 0 20px #0ff;
      text-align: center;
    }
    .uid-badge p { margin: 5px 0; }

    /* Social icons */
    .socials {
      position: absolute; bottom: 50px; left: 50%;
      transform: translateX(-50%);
      display: flex; gap: 60px;
    }
    .socials a {
      font-size: 50px; color: #ccc;
      transition: all 0.3s ease;
    }
    .socials a:hover { transform: scale(1.2); }
    .socials a.youtube:hover { color: #ff0000; }
    .socials a.discord:hover { color: #5865F2; }
    .socials a.instagram:hover { color: #E1306C; }

    /* Hide main until enter */
    #main-content { display: none; }

    /* Mute button */
    #mute-btn {
      position: fixed;
      top: 20px; right: 20px;
      z-index: 999;
      background: rgba(0,0,0,0.5);
      border: none; color: white;
      font-size: 24px;
      padding: 12px 16px;
      border-radius: 50%;
      cursor: pointer;
      transition: background 0.3s ease;
      display: none;
    }
    #mute-btn:hover { background: rgba(255,255,255,0.2); }

    /* 📱 Mobile responsiveness */
    @media (max-width: 768px) {
      .title h1 { font-size: 45px; }
      .title p { font-size: 22px; }
      .center-gif img { width: 150px; height: 150px; }
      .uid-badge { font-size: 16px; padding: 8px 14px; top: 68%; }
      .socials { gap: 25px; }
      .socials a { font-size: 35px; }
    }

    @media (max-width: 480px) {
      .title h1 { font-size: 35px; }
      .title p { font-size: 18px; }
      .center-gif img { width: 120px; height: 120px; }
      .uid-badge { font-size: 14px; top: 70%; padding: 6px 12px; }
      .socials a { font-size: 30px; }
    }
  </style>
</head>
<body>

  <!-- Landing page -->
  <div id="landing-page" class="center-content">
    <a href="#" id="enter-btn" class="enter-button">Enter</a>
  </div>

  <!-- Main content -->
  <div id="main-content">
    <video autoplay muted loop id="bgVideo">
      <source src="bg.mp4" type="video/mp4">
      Your browser does not support HTML5 video.
    </video>

    <div class="title">
      <h1 class="animate">AM4R</h1>
      <p class="animate">Just a noob gamer!</p>
    </div>

    <div class="center-gif">
      <img src="giphy.gif" alt="center gif">
    </div>

    <div class="uid-badge">
      <p>Game name: 120FPS AM4R!</p>
      <p>UID: 2449575588</p>
    </div>

    <div class="socials">
      <a href="https://www.youtube.com/@am4rx19" target="_blank" class="youtube"><i class="fab fa-youtube"></i></a>
      <a href="https://discord.gg/nfqwJ7jn" target="_blank" class="discord"><i class="fab fa-discord"></i></a>
      <a href="https://www.instagram.com/_am4rx19_" target="_blank" class="instagram"><i class="fab fa-instagram"></i></a>
    </div>

    <audio id="background-audio" loop>
      <source src="sound.mp3" type="audio/mpeg">
      Your browser does not support audio.
    </audio>

    <button id="mute-btn"><i class="fas fa-volume-up"></i></button>
  </div>

  <script>
    const enterBtn = document.getElementById("enter-btn");
    const mainContent = document.getElementById("main-content");
    const landingPage = document.getElementById("landing-page");
    const bgAudio = document.getElementById("background-audio");
    const muteBtn = document.getElementById("mute-btn");

    enterBtn.addEventListener("click", function(event) {
      event.preventDefault();
      landingPage.style.display = "none";
      mainContent.style.display = "block";

      bgAudio.muted = false;
      bgAudio.play().then(() => {
        muteBtn.style.display = "block";
      }).catch(err => {
        console.log("Audio play blocked:", err);
        muteBtn.style.display = "block";
      });
    });

    muteBtn.addEventListener("click", () => {
      bgAudio.muted = !bgAudio.muted;
      const icon = muteBtn.querySelector("i");
      if (bgAudio.muted) {
        icon.classList.remove("fa-volume-up");
        icon.classList.add("fa-volume-mute");
      } else {
        icon.classList.remove("fa-volume-mute");
        icon.classList.add("fa-volume-up");
      }
    });
  </script>

</body>
</html>
